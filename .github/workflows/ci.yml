name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        gemfile:
          - gemfiles/activeadmin_3.5.gemfile
          - gemfiles/activeadmin_4.0.gemfile
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # One step per dummy app: each boots a different Rails app, so they
      # cannot share a process — and a separate step names which host
      # shape broke instead of burying it in a combined run.
      - name: Default suite (spec/dummy — ActiveAdmin at /admin)
        run: bundle exec rake spec
      - name: Engine-mounted Devise suite (spec/dummy_engine)
        run: bundle exec rake spec:engine
      - name: Isolated-engine suite (spec/dummy_isolated)
        run: bundle exec rake spec:isolated
      - name: Root-mounted suite (spec/dummy_root — ActiveAdmin at /)
        run: bundle exec rake spec:root
